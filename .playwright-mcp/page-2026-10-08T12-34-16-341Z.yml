        - text: "est un label professionnel délivré par des organismes accrédités — principalement Qualibat, Qualifelec ou Qualipac — attestant qu'une entreprise du secteur de la construction dispose des compétences techniques, financières et humaines requises pour exercer son activité. Ce dispositif, encadré par les règles de l'art définies dans les normes NF et les Documents Techniques Unifiés (DTU), distingue les professionnels qui répondent à un niveau d'exigence vérifié des simples déclarants. En vertu de l'article L241-1 du Code des assurances, toute personne physique ou morale dont la responsabilité décennale peut être engagée est tenue de souscrire une assurance avant l'ouverture de tout chantier : la qualification renforce cette obligation en précisant le périmètre exact des activités couvertes."
